esphome:
  name: lampsmart-test

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Lampsmart Pro Light"

captive_portal:

web_server:
  version: 3

external_components:
  - source:
      type: github
      url: https://github.com/zt8989/esphome-lampsmart-pro
      path: components
    components: [lampsmart_pro_light]

light:
  - platform: lampsmart_pro_light
    name: "Test Light"
    group: 1
    default_transition_length: 0s
    duration: 500
